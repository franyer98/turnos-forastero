name: Compilar APK

on:
  push:
    branches: [main]
    # Cambiar solo los turnos (datos/) no recompila: la app los baja sola
    paths-ignore:
      - "datos/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Copiar los turnos más recientes dentro del APK
        run: cp datos/meses.json app/src/main/assets/meses.json

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK y crear version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk TurnosForastero.apk
          echo "{\"versionCode\": $((100 + GITHUB_RUN_NUMBER)), \"versionName\": \"1.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TurnosForastero
          path: TurnosForastero.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Turnos Forastero (última versión)
          body: "APK compilado automáticamente desde ${{ github.sha }}"
          files: |
            TurnosForastero.apk
            version.json
          make_latest: true
